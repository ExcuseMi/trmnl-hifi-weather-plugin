  name-nl: 'Sensor van een andere TRMNL'
  name-ja: '別のTRMNLのセンサー'
  description: 'The number of the other TRMNL: the digits in the address of its page on trmnl.com (.../devices/1234). Empty or not found: this TRMNL''s own sensor.'
  description-de: 'Die Nummer des anderen TRMNL: die Ziffern in der Adresse seiner Seite auf trmnl.com (.../devices/1234). Leer oder nicht gefunden: der eigene Sensor dieses TRMNL.'
  description-fr: 'Le numéro de l''autre TRMNL : les chiffres dans l''adresse de sa page sur trmnl.com (.../devices/1234). Vide ou introuvable : le capteur de ce TRMNL.'
  description-es-ES: 'El número del otro TRMNL: los dígitos de la dirección de su página en trmnl.com (.../devices/1234). Vacío o no encontrado: el sensor de este TRMNL.'
  description-nl: 'Het nummer van de andere TRMNL: de cijfers in het adres van zijn pagina op trmnl.com (.../devices/1234). Leeg of niet gevonden: de eigen sensor van deze TRMNL.'
  description-ja: 'もう一方のTRMNLの番号（trmnl.comのデバイスページのアドレスにある数字、.../devices/1234）。空欄または見つからない場合は、このTRMNLのセンサーを使います。'
