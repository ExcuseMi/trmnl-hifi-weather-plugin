- keyname: week_style
  group: Display
  field_type: select
  name: 'Week display'
  name-de: 'Wochenanzeige'
  name-fr: 'Affichage de la semaine'
  name-es-ES: 'Vista de la semana'
  name-nl: 'Weekweergave'
  name-ja: '週の表示'
  description: 'The coming days as columns: EQ sliders (a slider per day on one shared temperature scale), Digital (the high and low in segment digits), or Auto (sliders on the TRMNL X, digits on smaller, 1-bit and 2-bit screens). Smaller views always show Digital.'
  description-de: 'Die nächsten Tage als Spalten: EQ-Regler (ein Regler pro Tag auf einer gemeinsamen Temperaturskala), Digital (Höchst- und Tiefstwert in Segmentziffern) oder Auto (Regler auf dem TRMNL X, Ziffern auf kleineren sowie 1-Bit- und 2-Bit-Bildschirmen). Kleinere Ansichten zeigen immer Digital.'
  description-fr: 'Les prochains jours en colonnes : curseurs EQ (un curseur par jour sur une échelle de température commune), Numérique (le maximum et le minimum en chiffres à segments) ou Auto (curseurs sur le TRMNL X, chiffres sur les écrans plus petits, 1 bit et 2 bits). Les vues plus petites affichent toujours Numérique.'
  description-es-ES: 'Los próximos días en columnas: deslizadores EQ (uno por día en una escala de temperatura común), Digital (máxima y mínima en dígitos de segmentos) o Auto (deslizadores en el TRMNL X, dígitos en pantallas más pequeñas, de 1 bit y de 2 bits). Las vistas más pequeñas siempre muestran Digital.'
  description-nl: 'De komende dagen als kolommen: EQ-schuiven (een schuif per dag op één gedeelde temperatuurschaal), Digitaal (hoogste en laagste in segmentcijfers) of Auto (schuiven op de TRMNL X, cijfers op kleinere, 1-bit- en 2-bitschermen). Kleinere weergaven tonen altijd Digitaal.'
  description-ja: '今後の数日を列で表示します。EQスライダー（共通の温度目盛り上に1日1本のスライダー）、デジタル（最高・最低気温をセグメント数字で表示）、または自動（TRMNL Xではスライダー、小さい画面と1ビット・2ビット画面ではデジタル）。小さい表示は常にデジタルです。'
  options:
  - Auto: auto
  - EQ sliders: eq
  - Digital: digital
  default: auto
  optional: true
