custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: '<strong>The weather as a calm early-80s hi-fi receiver.</strong> Big segment digits for the temperature, meters for what matters, and the coming days or hours as a strip.<br /><br /><strong>Dials</strong> (TRMNL X): a barometer with the pressure trend and a temperature dial with today''s low and high.<br /><strong>Console</strong>: the temperature with what to wear: clothing, an umbrella, sunglasses.<br /><strong>Meters</strong>: wind and gusts, UV, air quality, humidity, pollen and pressure, only when they matter.<br /><strong>Rain or sun</strong>: an hour calendar when rain is coming, otherwise sunrise, sunset and the moon.<br /><strong>Bottom strip</strong>: the coming days or hours.<br /><strong>Indoor sensor</strong>: a TRMNL sensor on this screen or on another TRMNL, with an optional label and CO2 meter.<br /><strong>Everywhere</strong>: every view, 1-bit, greyscale and colour screens, dark mode, 24 or 12 hour time, six languages.<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">Try it in your browser</a>, with live weather.<br /><br /><strong>Credits</strong>: weather and air quality from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>; texts in your language from TRMNL''s translations.'
  description-de: '<strong>Das Wetter als ruhiger Hi-Fi-Receiver der frühen 80er.</strong> Große Segmentziffern für die Temperatur, Messer für das, was zählt, und die nächsten Tage oder Stunden als Leiste.<br /><br /><strong>Zifferblätter</strong> (TRMNL X): ein Barometer mit Luftdrucktendenz und ein Thermometer mit Tiefst- und Höchstwert von heute.<br /><strong>Konsole</strong>: die Temperatur mit passender Kleidung, Schirm oder Sonnenbrille.<br /><strong>Messer</strong>: Wind mit Böen, UV, Luftqualität, Luftfeuchte, Pollen und Luftdruck, nur wenn sie wichtig sind.<br /><strong>Regen oder Sonne</strong>: ein Stundenkalender, wenn Regen kommt, sonst Sonnenaufgang, Sonnenuntergang und Mond.<br /><strong>Untere Leiste</strong>: die nächsten Tage oder Stunden.<br /><strong>Innensensor</strong>: ein TRMNL-Sensor an diesem Bildschirm oder an einem anderen TRMNL, mit eigenem Namen und CO2-Messer.<br /><strong>Überall</strong>: alle Ansichten, 1-Bit-, Graustufen- und Farbbildschirme, Dunkelmodus, 24- oder 12-Stunden-Zeit, sechs Sprachen.<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">Im Browser ausprobieren</a>, auch mit dem echten Wetter.<br /><br /><strong>Quellen</strong>: Wetter und Luftqualität von <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>; Texte in deiner Sprache aus den Übersetzungen von TRMNL.'
  description-fr: '<strong>La météo comme un ampli hi-fi apaisé du début des années 80.</strong> De grands chiffres à segments pour la température, des jauges pour ce qui compte, et les prochains jours ou heures en bande.<br /><br /><strong>Cadrans</strong> (TRMNL X) : un baromètre avec la tendance de la pression et un cadran de température avec le minimum et le maximum du jour.<br /><strong>Console</strong> : la température et quoi porter : vêtements, parapluie, lunettes de soleil.<br /><strong>Jauges</strong> : vent et rafales, UV, qualité de l''air, humidité, pollen et pression, seulement quand elles comptent.<br /><strong>Pluie ou soleil</strong> : un calendrier des heures quand la pluie arrive, sinon lever et coucher du soleil et la lune.<br /><strong>Bande du bas</strong> : les prochains jours ou les prochaines heures.<br /><strong>Capteur intérieur</strong> : un capteur TRMNL sur cet écran ou sur un autre TRMNL, avec un nom facultatif et une jauge de CO2.<br /><strong>Partout</strong> : toutes les vues, écrans 1 bit, niveaux de gris et couleur, mode sombre, heure sur 24 ou 12 heures, six langues.<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">Essayer dans le navigateur</a>, avec la météo en direct.<br /><br /><strong>Sources</strong> : météo et qualité de l''air par <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> ; textes dans votre langue d''après les traductions de TRMNL.'
  description-es-ES: '<strong>El tiempo como un receptor hi-fi tranquilo de principios de los 80.</strong> Grandes dígitos de segmentos para la temperatura, medidores para lo que importa y los próximos días u horas como franja.<br /><br /><strong>Diales</strong> (TRMNL X): un barómetro con la tendencia de la presión y un dial de temperatura con la mínima y la máxima de hoy.<br /><strong>Consola</strong>: la temperatura y qué ponerse: ropa, paraguas, gafas de sol.<br /><strong>Medidores</strong>: viento y rachas, UV, calidad del aire, humedad, polen y presión, solo cuando importan.<br /><strong>Lluvia o sol</strong>: un calendario de horas cuando viene lluvia; si no, salida y puesta del sol y la luna.<br /><strong>Franja inferior</strong>: los próximos días o las próximas horas.<br /><strong>Sensor interior</strong>: un sensor TRMNL en esta pantalla o en otro TRMNL, con nombre opcional y medidor de CO2.<br /><strong>En todas partes</strong>: todas las vistas, pantallas de 1 bit, escala de grises y color, modo oscuro, hora de 24 o 12 horas, seis idiomas.<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">Pruébalo en el navegador</a>, también con el tiempo en directo.<br /><br /><strong>Créditos</strong>: tiempo y calidad del aire de <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>; textos en tu idioma de las traducciones de TRMNL.'
  description-nl: '<strong>Het weer als een rustige hifi-receiver uit de vroege jaren 80.</strong> Grote segmentcijfers voor de temperatuur, meters voor wat telt en de komende dagen of uren als strook.<br /><br /><strong>Wijzers</strong> (TRMNL X): een barometer met de drukverandering en een temperatuurwijzer met de laagste en hoogste temperatuur van vandaag.<br /><strong>Console</strong>: de temperatuur met wat je aantrekt: kleding, paraplu, zonnebril.<br /><strong>Meters</strong>: wind met windstoten, UV, luchtkwaliteit, luchtvochtigheid, pollen en luchtdruk, alleen als ze ertoe doen.<br /><strong>Regen of zon</strong>: een uurkalender als er regen aankomt, anders zonsopgang, zonsondergang en de maan.<br /><strong>Onderste strook</strong>: de komende dagen of uren.<br /><strong>Binnensensor</strong>: een TRMNL-sensor op dit scherm of op een andere TRMNL, met een optionele naam en CO2-meter.<br /><strong>Overal</strong>: alle weergaven, 1-bit-, grijstinten- en kleurenschermen, donkere modus, 24- of 12-uurs tijd, zes talen.<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">Probeer het in je browser</a>, ook met het weer van nu.<br /><br /><strong>Bronnen</strong>: weer en luchtkwaliteit van <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>; teksten in jouw taal uit de vertalingen van TRMNL.'
  description-ja: '<strong>80年代初頭のハイファイ・レシーバーのような、落ち着いた天気表示。</strong>気温は大きなセグメント数字、大切な情報はメーター、これからの数日または数時間は下のバーで表示します。<br /><br /><strong>ダイヤル</strong>（TRMNL X）：気圧の傾向つきの気圧計と、今日の最低・最高気温つきの温度ダイヤル。<br /><strong>コンソール</strong>：気温と服装のヒント（服、傘、サングラス）。<br /><strong>メーター</strong>：風と突風、UV、大気質、湿度、花粉、気圧。必要なときだけ表示します。<br /><strong>雨または太陽</strong>：雨が近いときは時間カレンダー、それ以外は日の出、日の入り、月。<br /><strong>下部バー</strong>：これからの数日または数時間。<br /><strong>室内センサー</strong>：この画面または別のTRMNLに付けたTRMNLセンサー。名前とCO2メーターも使えます。<br /><strong>どこでも</strong>：すべての表示サイズ、1ビット・グレースケール・カラー画面、ダークモード、24時間または12時間表示、6言語。<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/" target="_blank">ブラウザで試す</a>（実際の天気も表示できます）。<br /><br /><strong>クレジット</strong>：天気と大気質は <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>、各言語の文言は TRMNL の翻訳を使用。'
  github_url: https://github.com/ExcuseMi/trmnl-radio-weather-plugin
  learn_more_url: https://excusemi.github.io/trmnl-radio-weather-plugin/
  category: environment
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or give latitude,longitude.
  description-de: Suche nach einer Stadt oder Postleitzahl, oder gib Breite,Länge an.
  description-fr: Cherche une ville ou un code postal, ou indique latitude,longitude.
  description-es-ES: Busca una ciudad o un código postal, o indica latitud,longitud.
  description-nl: Zoek een stad of postcode, of geef breedtegraad,lengtegraad.
  description-ja: 都市名か郵便番号で検索するか、緯度,経度を入力します。
  placeholder: 52.52,13.41
  default: 52.52,13.41
- keyname: unit
  group: Display
  field_type: select
  name: Temperature unit
  description: 'Celsius or Fahrenheit for every temperature on the screen.'
  description-de: 'Celsius oder Fahrenheit für alle Temperaturen auf dem Bildschirm.'
  description-fr: 'Celsius ou Fahrenheit pour toutes les températures à l''écran.'
  description-es-ES: 'Celsius o Fahrenheit para todas las temperaturas de la pantalla.'
  description-nl: 'Celsius of Fahrenheit voor alle temperaturen op het scherm.'
  description-ja: '画面のすべての温度を摂氏または華氏で表示します。'
  options:
  - Celsius: celsius
  - Fahrenheit: fahrenheit
  default: celsius
- keyname: time_format
  group: Display
  field_type: select
  name: Time format
  description: How times show on the screen (sunrise, sunset, rain hours).
  description-de: Wie Uhrzeiten auf dem Bildschirm erscheinen (Sonnenaufgang, Sonnenuntergang, Regenstunden).
  description-fr: Format des heures à l'écran (lever, coucher du soleil, heures de pluie).
  description-es-ES: Cómo se muestran las horas en la pantalla (amanecer, atardecer, horas de lluvia).
  description-nl: Hoe tijden op het scherm staan (zonsopkomst, zonsondergang, regenuren).
  description-ja: 画面の時刻の表示形式（日の出、日の入り、雨の時間）。
  options:
  - 24 hours (17:00): '24'
  - 12 hours (5:00 PM): '12'
  default: '24'
- keyname: bottom
  group: Display
  field_type: select
  name: Bottom strip
  description: The coming days, or the coming hours with their temperature; or both by the clock (hours until 18:00, days from 18:00).
  description-de: 'Die nächsten Tage oder die nächsten Stunden mit ihrer Temperatur; oder beides nach der Uhr (Stunden bis 18:00, Tage ab 18:00).'
  description-fr: 'Les prochains jours, ou les prochaines heures avec leur température ; ou les deux selon l''heure (heures jusqu''à 18:00, jours dès 18:00).'
  description-es-ES: 'Los próximos días, o las próximas horas con su temperatura; o ambos según la hora (horas hasta las 18:00, días desde las 18:00).'
  description-nl: 'De komende dagen, of de komende uren met hun temperatuur; of beide volgens de klok (uren tot 18:00, dagen vanaf 18:00).'
  description-ja: '今後の数日、または今後の数時間とその気温。時刻で切り替えることもできます（18:00までは時間、18:00からは日）。'
  options:
  - Days: days
  - Hours: hours
  - Hours, days after 18:00: auto
  default: auto
- keyname: hide_title_bar
  group: Display
  field_type: boolean
  name: Hide title bar
  description: 'Hide the bar with the plugin name and update time at the bottom.'
  description-de: 'Die Leiste mit Plugin-Name und Aktualisierungszeit unten ausblenden.'
  description-fr: 'Masquer la barre du bas avec le nom du plugin et l''heure de mise à jour.'
  description-es-ES: 'Ocultar la barra inferior con el nombre del plugin y la hora de actualización.'
  description-nl: 'De balk onderaan met de pluginnaam en de update-tijd verbergen.'
  description-ja: '下部のプラグイン名と更新時刻のバーを非表示にします。'
  default: false
- keyname: sensor_show
  group: Sensor
  field_type: select
  name: Sensor
  description: 'Show the readings of a TRMNL sensor: this screen''s own, or the TRMNL set below. Hide shows the outside weather only.'
  description-de: 'Die Werte eines TRMNL-Sensors anzeigen: den dieses Bildschirms oder den des unten gewählten TRMNL. Ausblenden zeigt nur das Außenwetter.'
  description-fr: 'Afficher les mesures d''un capteur TRMNL : celui de cet écran, ou celui du TRMNL indiqué ci-dessous. Masquer n''affiche que la météo extérieure.'
  description-es-ES: 'Mostrar las lecturas de un sensor TRMNL: el de esta pantalla o el del TRMNL indicado abajo. Ocultar muestra solo el tiempo exterior.'
  description-nl: 'Toon de meetwaarden van een TRMNL-sensor: die van dit scherm, of die van de TRMNL hieronder. Verbergen toont alleen het buitenweer.'
  description-ja: 'TRMNLセンサーの値を表示します（この画面のセンサー、または下で指定したTRMNLのセンサー）。非表示にすると屋外の天気だけを表示します。'
  options:
  - Show: show
  - Hide: hide
  default: show
- keyname: sensor_device_id
  group: Sensor
  field_type: string
  name: Sensor from another TRMNL
  description: 'Optional. To show the sensor of another TRMNL, enter that device''s number: the digits in the address of its page on trmnl.com (.../devices/1234). Leave empty to use this screen''s own sensor.'
  description-de: 'Optional. Um den Sensor eines anderen TRMNL zu zeigen, gib die Nummer dieses Geräts ein: die Ziffern in der Adresse seiner Seite auf trmnl.com (.../devices/1234). Leer lassen, um den Sensor dieses Bildschirms zu nutzen.'
  description-fr: 'Facultatif. Pour afficher le capteur d''un autre TRMNL, saisis le numéro de cet appareil : les chiffres dans l''adresse de sa page sur trmnl.com (.../devices/1234). Laisse vide pour utiliser le capteur de cet écran.'
  description-es-ES: 'Opcional. Para mostrar el sensor de otro TRMNL, introduce el número de ese dispositivo: los dígitos de la dirección de su página en trmnl.com (.../devices/1234). Déjalo vacío para usar el sensor de esta pantalla.'
  description-nl: 'Optioneel. Om de sensor van een andere TRMNL te tonen, vul het nummer van dat apparaat in: de cijfers in het adres van zijn pagina op trmnl.com (.../devices/1234). Laat leeg voor de sensor van dit scherm.'
  description-ja: '任意。別のTRMNLのセンサーを表示するには、そのデバイスの番号（trmnl.comのデバイスページのアドレスにある数字、.../devices/1234）を入力します。空欄ならこの画面のセンサーを使います。'
  placeholder: '1234'
- keyname: sensor_label
  group: Sensor
  field_type: string
  name: Sensor label
  description: 'Optional. A short name for the sensor, for example Upstairs. It shows next to the house icon and on the temperature dial. Empty shows the icon alone.'
  description-de: 'Optional. Ein kurzer Name für den Sensor, zum Beispiel Oben. Er steht neben dem Haus-Symbol und am Thermometer. Leer zeigt nur das Symbol.'
  description-fr: 'Facultatif. Un nom court pour le capteur, par exemple Étage. Il s''affiche à côté de l''icône de maison et sur le thermomètre. Vide : l''icône seule.'
  description-es-ES: 'Opcional. Un nombre corto para el sensor, por ejemplo Arriba. Se muestra junto al icono de la casa y en el termómetro. Vacío muestra solo el icono.'
  description-nl: 'Optioneel. Een korte naam voor de sensor, bijvoorbeeld Boven. Hij staat naast het huisje en bij de thermometer. Leeg toont alleen het huisje.'
  description-ja: '任意。センサーの短い名前（例：2階）。家のアイコンの横と温度計に表示されます。空欄ならアイコンだけを表示します。'
  placeholder: Upstairs
- keyname: sensor_primary
  group: Sensor
  field_type: select
  name: Main reading
  description: 'Which reading comes first, in black; the other follows in grey. Automatic: the sensor when it is this screen''s own, the outside weather when it comes from another TRMNL.'
  description-de: 'Welcher Wert zuerst und in Schwarz steht; der andere folgt in Grau. Automatisch: der Sensor, wenn es der eigene dieses Bildschirms ist, das Außenwetter, wenn er von einem anderen TRMNL kommt.'
  description-fr: 'Quelle valeur vient en premier, en noir ; l''autre suit en gris. Automatique : le capteur s''il est celui de cet écran, la météo extérieure s''il vient d''un autre TRMNL.'
  description-es-ES: 'Qué lectura va primero, en negro; la otra sigue en gris. Automático: el sensor si es el de esta pantalla, el tiempo exterior si viene de otro TRMNL.'
  description-nl: 'Welke waarde eerst en in zwart staat; de andere volgt in grijs. Automatisch: de sensor als het die van dit scherm is, het buitenweer als hij van een andere TRMNL komt.'
  description-ja: 'どちらの値を先に黒で表示するか（もう一方は灰色）。自動：この画面のセンサーならセンサー、別のTRMNLのセンサーなら屋外の天気。'
  options:
  - Automatic: auto
  - Sensor: sensor
  - Outside: outside
  default: auto
- keyname: sensor_co2
  group: Sensor
  field_type: select
  name: CO2 meter
  description: 'Show the CO2 meter when the sensor measures CO2.'
  description-de: 'Den CO2-Messer zeigen, wenn der Sensor CO2 misst.'
  description-fr: 'Afficher la jauge de CO2 quand le capteur mesure le CO2.'
  description-es-ES: 'Mostrar el medidor de CO2 cuando el sensor mide CO2.'
  description-nl: 'Toon de CO2-meter als de sensor CO2 meet.'
  description-ja: 'センサーがCO2を測定するとき、CO2メーターを表示します。'
  options:
  - Show: show
  - Hide: hide
  default: show
name: Radio Weather
description: Weather as a vintage radio receiver
refresh_interval: 5
