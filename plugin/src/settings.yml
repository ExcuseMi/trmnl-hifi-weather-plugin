- keyname: legend
  group: Legend
  field_type: description
  name: 'Legend'
  optional: true
  description: '<strong>Dials</strong> (X): barometer 970 to 1050 hPa with the zones thunderstorm, rain, changeable, sunny; temperature dial with today''s low (outlined triangle) and high (filled triangle). The needle is now.<br /><strong>Digits</strong>: the temperature now; the arrow compares with 3 hours ahead.<br /><strong>What to wear</strong>: by the felt temperature of the next 3 hours: parka under 3 C, jacket under 12, sweater under 18, otherwise T-shirt. Umbrella from a 50 % rain chance.<br /><strong>Sensor</strong>: house icon is the sensor, tree icon the outside weather; the grey needle is the other reading.<br /><strong>Rain</strong>: dark hours have a rain chance of 50 % or more. Gauge: 1 block drizzle, 2 rain, 3 heavy rain (4 mm/h and up).<br /><strong>Sun and moon</strong>: the next sunrise and sunset, the moon phase at your place.<br /><strong>Bottom strip</strong>: hours (black time stamp: now or rain) or days (low, high, range bar, what to wear).<br /><strong>Meters</strong>: 10 blocks (5 on small screens). Yellow is a warning, red is alarming (colour screens only). Light grey blocks: the highest still to come today. Outline: the strongest gust.<br /><strong>WIND</strong> 0 to 60 km/h: warning from 30, alarming from 50 (mph: 20 and 30).<br /><strong>UV</strong> 0 to 11, WHO bands: warning from 3 (moderate), alarming from 8 (very high).<br /><strong>AQI</strong> European AQI 0 to 100: warning from 40 (moderate), alarming from 60 (poor).<br /><strong>POLLEN</strong> grains per m3, strongest type: warning from 10, alarming from 50.<br /><strong>CO2</strong> 400 to 2000 ppm (sensor): warning from 1000, alarming from 1400.<br /><strong>HUM</strong> 0 to 100 % and <strong>BARO</strong> 970 to 1050 hPa: plain readings (normal pressure about 1013 hPa).<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">Full guide</a>'
  description-de: '<strong>Zifferblätter</strong> (X): Barometer 970 bis 1050 hPa mit den Zonen Gewitter, Regen, wechselhaft, sonnig; Thermometer mit Tiefst- (Dreieck mit Rand) und Höchstwert (gefülltes Dreieck) von heute. Die Nadel ist jetzt.<br /><strong>Ziffern</strong>: die Temperatur jetzt; der Pfeil vergleicht mit in 3 Stunden.<br /><strong>Was anziehen</strong>: nach der gefühlten Temperatur der nächsten 3 Stunden: Parka unter 3 C, Jacke unter 12, Pullover unter 18, sonst T-Shirt. Regenschirm ab 50 % Regenwahrscheinlichkeit.<br /><strong>Sensor</strong>: Haus-Symbol ist der Sensor, Baum-Symbol das Außenwetter; die graue Nadel ist der andere Wert.<br /><strong>Regen</strong>: dunkle Stunden haben 50 % oder mehr Regenwahrscheinlichkeit. Regenmesser: 1 Block Nieselregen, 2 Regen, 3 Starkregen (ab 4 mm/h).<br /><strong>Sonne und Mond</strong>: der nächste Sonnenauf- und -untergang, die Mondphase an deinem Ort.<br /><strong>Untere Leiste</strong>: Stunden (schwarzer Zeitstempel: jetzt oder Regen) oder Tage (Tiefst, Höchst, Balken, was anziehen).<br /><strong>Messer</strong>: 10 Blöcke (5 auf kleinen Bildschirmen). Gelb ist eine Warnung, Rot ist Alarm (nur Farbbildschirme). Hellgraue Blöcke: der höchste Wert, der heute noch kommt. Rahmen: die stärkste Böe.<br /><strong>WIND</strong> 0 bis 60 km/h: Warnung ab 30, Alarm ab 50 (mph: 20 und 30).<br /><strong>UV</strong> 0 bis 11, WHO-Stufen: Warnung ab 3 (mäßig), Alarm ab 8 (sehr hoch).<br /><strong>AQI</strong> europäischer AQI 0 bis 100: Warnung ab 40 (mäßig), Alarm ab 60 (schlecht).<br /><strong>POLLEN</strong> Körner pro m3, stärkste Art: Warnung ab 10, Alarm ab 50.<br /><strong>CO2</strong> 400 bis 2000 ppm (Sensor): Warnung ab 1000, Alarm ab 1400.<br /><strong>FEUCHTE</strong> 0 bis 100 % und <strong>BARO</strong> 970 bis 1050 hPa: reine Messwerte (normaler Druck etwa 1013 hPa).<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">Ganze Anleitung</a>'
  description-fr: '<strong>Cadrans</strong> (X) : baromètre 970 à 1050 hPa avec les zones orage, pluie, variable, soleil ; cadran de température avec le minimum (triangle creux) et le maximum (triangle plein) du jour. L''aiguille est le moment présent.<br /><strong>Chiffres</strong> : la température actuelle ; la flèche compare avec dans 3 heures.<br /><strong>Quoi porter</strong> : selon la température ressentie des 3 prochaines heures : parka sous 3 C, veste sous 12, pull sous 18, sinon T-shirt. Parapluie dès 50 % de chance de pluie.<br /><strong>Capteur</strong> : la maison est le capteur, l''arbre la météo extérieure ; l''aiguille grise est l''autre mesure.<br /><strong>Pluie</strong> : les heures sombres ont 50 % de chance de pluie ou plus. Jauge : 1 bloc bruine, 2 pluie, 3 forte pluie (dès 4 mm/h).<br /><strong>Soleil et lune</strong> : le prochain lever et coucher du soleil, la phase de la lune chez toi.<br /><strong>Bande du bas</strong> : heures (heure en noir : maintenant ou pluie) ou jours (minimum, maximum, barre, quoi porter).<br /><strong>Jauges</strong> : 10 blocs (5 sur les petits écrans). Jaune : avertissement, rouge : alerte (écrans couleur seulement). Blocs gris clair : le maximum encore à venir aujourd''hui. Contour : la rafale la plus forte.<br /><strong>VENT</strong> 0 à 60 km/h : avertissement dès 30, alerte dès 50 (mph : 20 et 30).<br /><strong>UV</strong> 0 à 11, niveaux de l''OMS : avertissement dès 3 (modéré), alerte dès 8 (très élevé).<br /><strong>AQI</strong> AQI européen 0 à 100 : avertissement dès 40 (moyen), alerte dès 60 (mauvais).<br /><strong>POLLEN</strong> grains par m3, type le plus fort : avertissement dès 10, alerte dès 50.<br /><strong>CO2</strong> 400 à 2000 ppm (capteur) : avertissement dès 1000, alerte dès 1400.<br /><strong>HUMIDITÉ</strong> 0 à 100 % et <strong>BARO</strong> 970 à 1050 hPa : simples mesures (pression normale environ 1013 hPa).<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">Guide complet</a>'
  description-es-ES: '<strong>Diales</strong> (X): barómetro 970 a 1050 hPa con las zonas tormenta, lluvia, variable, soleado; dial de temperatura con la mínima (triángulo vacío) y la máxima (triángulo lleno) de hoy. La aguja es el momento actual.<br /><strong>Dígitos</strong>: la temperatura actual; la flecha compara con dentro de 3 horas.<br /><strong>Qué ponerse</strong>: según la sensación térmica de las próximas 3 horas: parka bajo 3 C, chaqueta bajo 12, jersey bajo 18, si no camiseta. Paraguas desde un 50 % de probabilidad de lluvia.<br /><strong>Sensor</strong>: la casa es el sensor, el árbol el tiempo exterior; la aguja gris es la otra lectura.<br /><strong>Lluvia</strong>: las horas oscuras tienen un 50 % o más de probabilidad de lluvia. Pluviómetro: 1 bloque llovizna, 2 lluvia, 3 lluvia fuerte (desde 4 mm/h).<br /><strong>Sol y luna</strong>: el próximo amanecer y atardecer, la fase de la luna en tu lugar.<br /><strong>Franja inferior</strong>: horas (hora en negro: ahora o lluvia) o días (mínima, máxima, barra, qué ponerse).<br /><strong>Medidores</strong>: 10 bloques (5 en pantallas pequeñas). Amarillo: aviso, rojo: alarma (solo pantallas en color). Bloques gris claro: el máximo que aún falta hoy. Contorno: la racha más fuerte.<br /><strong>VIENTO</strong> 0 a 60 km/h: aviso desde 30, alarma desde 50 (mph: 20 y 30).<br /><strong>UV</strong> 0 a 11, niveles de la OMS: aviso desde 3 (moderado), alarma desde 8 (muy alto).<br /><strong>AQI</strong> AQI europeo 0 a 100: aviso desde 40 (regular), alarma desde 60 (malo).<br /><strong>POLEN</strong> granos por m3, el tipo más fuerte: aviso desde 10, alarma desde 50.<br /><strong>CO2</strong> 400 a 2000 ppm (sensor): aviso desde 1000, alarma desde 1400.<br /><strong>HUMEDAD</strong> 0 a 100 % y <strong>BARO</strong> 970 a 1050 hPa: simples lecturas (presión normal unos 1013 hPa).<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">Guía completa</a>'
  description-nl: '<strong>Wijzers</strong> (X): barometer 970 tot 1050 hPa met de zones onweer, regen, wisselvallig, zonnig; temperatuurwijzer met de laagste (open driehoek) en hoogste (gevulde driehoek) temperatuur van vandaag. De naald is nu.<br /><strong>Cijfers</strong>: de temperatuur nu; de pijl vergelijkt met over 3 uur.<br /><strong>Wat aantrekken</strong>: naar de gevoelstemperatuur van de komende 3 uur: parka onder 3 C, jas onder 12, trui onder 18, anders T-shirt. Paraplu vanaf 50 % kans op regen.<br /><strong>Sensor</strong>: het huisje is de sensor, de boom het buitenweer; de grijze naald is de andere meting.<br /><strong>Regen</strong>: donkere uren hebben 50 % of meer kans op regen. Regenmeter: 1 blokje motregen, 2 regen, 3 zware regen (vanaf 4 mm/u).<br /><strong>Zon en maan</strong>: de volgende zonsopkomst en zonsondergang, de maanstand op jouw plek.<br /><strong>Strook onderaan</strong>: uren (zwarte tijd: nu of regen) of dagen (laagste, hoogste, balk, wat aantrekken).<br /><strong>Meters</strong>: 10 blokjes (5 op kleine schermen). Geel is een waarschuwing, rood is alarm (alleen kleurenschermen). Lichtgrijze blokjes: het hoogste dat vandaag nog komt. Rand: de hardste windstoot.<br /><strong>WIND</strong> 0 tot 60 km/u: waarschuwing vanaf 30, alarm vanaf 50 (mph: 20 en 30).<br /><strong>UV</strong> 0 tot 11, WHO-niveaus: waarschuwing vanaf 3 (matig), alarm vanaf 8 (zeer hoog).<br /><strong>AQI</strong> Europese AQI 0 tot 100: waarschuwing vanaf 40 (matig), alarm vanaf 60 (slecht).<br /><strong>POLLEN</strong> korrels per m3, sterkste soort: waarschuwing vanaf 10, alarm vanaf 50.<br /><strong>CO2</strong> 400 tot 2000 ppm (sensor): waarschuwing vanaf 1000, alarm vanaf 1400.<br /><strong>VOCHT</strong> 0 tot 100 % en <strong>BARO</strong> 970 tot 1050 hPa: gewone metingen (normale druk ongeveer 1013 hPa).<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">Volledige gids</a>'
  description-ja: '<strong>ダイヤル</strong>（X）：気圧計は970〜1050 hPaで、ゾーンは雷雨、雨、変わりやすい、晴れ。温度ダイヤルは今日の最低（白抜きの三角）と最高（黒の三角）。針は現在の値です。<br /><strong>数字</strong>：現在の気温。矢印は3時間後との比較です。<br /><strong>服装</strong>：今後3時間の体感温度で決まります。3 C未満はパーカー、12未満はジャケット、18未満はセーター、それ以上はTシャツ。降水確率50 %以上で傘。<br /><strong>センサー</strong>：家のアイコンはセンサー、木のアイコンは屋外の天気。グレーの針はもう一方の値です。<br /><strong>雨</strong>：濃い時間は降水確率50 %以上。雨量計：1ブロックは小雨、2は雨、3は大雨（4 mm/h以上）。<br /><strong>太陽と月</strong>：次の日の出と日の入り、あなたの場所での月の満ち欠け。<br /><strong>下のバー</strong>：時間（黒い時刻は現在または雨）か日（最低、最高、バー、服装）。<br /><strong>メーター</strong>：10ブロック（小さい画面では5）。黄色は注意、赤は警戒（カラー画面のみ）。薄いグレーのブロックは今日これから来る最大値、枠は最大瞬間風速。<br /><strong>風</strong> 0〜60 km/h：30から注意、50から警戒（mph：20と30）。<br /><strong>UV</strong> 0〜11、WHOの区分：3から注意（中程度）、8から警戒（非常に強い）。<br /><strong>AQI</strong> 欧州AQI 0〜100：40から注意（やや悪い）、60から警戒（悪い）。<br /><strong>花粉</strong> 1 m3あたりの粒数、最も多い種類：10から注意、50から警戒。<br /><strong>CO2</strong> 400〜2000 ppm（センサー）：1000から注意、1400から警戒。<br /><strong>湿度</strong> 0〜100 %と<strong>気圧</strong> 970〜1050 hPa：数値だけを示します（標準気圧は約1013 hPa）。<br /><br /><a href="https://excusemi.github.io/trmnl-radio-weather-plugin/#guide" target="_blank">詳しいガイド</a>'
name: Radio Weather
description: Weather as a vintage radio receiver
refresh_interval: 5
